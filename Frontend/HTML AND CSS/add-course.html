<!DOCTYPE html>
<html lang="en">

<head>

<title>Add Course | CourseHub</title>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:Segoe UI,sans-serif;
background:#0f172a;
color:white;

}


/* Navbar */

.navbar{

display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;

background:linear-gradient(90deg,#4f46e5,#06b6d4);

}


.navbar h2{

margin:0;

}


.navbar a{

color:white;
text-decoration:none;
margin:0 12px;

}


.navbar a:hover{

color:#facc15;

}



/* Main Container */

.container{

min-height:85vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px 20px;

}



/* Card */

.card{

width:420px;
max-width:100%;

padding:35px;

background:#1f2937;

border-radius:18px;

box-shadow:0 10px 30px rgba(0,0,0,.5);

text-align:center;

}



/* Inputs */


input,
textarea,
select{

width:100%;

padding:12px;

margin-bottom:15px;

border:none;

border-radius:10px;

background:#374151;

color:white;

outline:none;

}



input:focus,
textarea:focus,
select:focus{

outline:2px solid #06b6d4;

}



textarea{

height:100px;

resize:none;

}



select option{

background:#374151;

color:white;

}



/* Button */

button{

width:100%;

padding:12px;

border:none;

border-radius:12px;

background:linear-gradient(90deg,#22c55e,#16a34a);

font-weight:bold;

cursor:pointer;

font-size:15px;

}


button:hover{

opacity:.9;

}



/* Footer */

footer{

text-align:center;

padding:20px;

color:#94a3b8;

}



/* Mobile Responsive */

@media(max-width:700px){


.navbar{

flex-direction:column;

gap:15px;

padding:20px;

}


.navbar a{

display:inline-block;

margin:5px;

}


.card{

padding:25px 20px;

}


}



</style>


</head>



<body>



<div class="navbar">


<h2>
🎓 CourseHub Admin
</h2>



<div>

<a href="admin-dashboard.html">
Dashboard
</a>


<a href="courses.html">
Courses
</a>


</div>



</div>






<div class="container">


<div class="card">



<h2>
➕ Add New Course
</h2>



<p style="color:#94a3b8;">

Create a new learning course

</p>




<input 
type="text"
id="courseName"
placeholder="Course Name">





<select id="category">


<option value="Select Category">

Select Category

</option>


<option value="Web Development">

Web Development

</option>


<option value="Programming">

Programming

</option>


<option value="Data Science">

Data Science

</option>


<option value="AI & Machine Learning">

AI & Machine Learning

</option>



</select>







<textarea 
id="description"
placeholder="Course Description">

</textarea>







<input
type="text"
id="duration"
placeholder="Course Duration">






<input
type="text"
id="instructor"
placeholder="Instructor Name">







<button onclick="addCourse()">

Add Course

</button>





</div>


</div>







<footer>

© 2026 CourseHub | Admin Panel

</footer>





<script src="script.js"></script>



</body>


</html>
